steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/xrplf-release-notifier', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/xrplf-release-notifier']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'xrplf-release-notifier'
      - '--image=gcr.io/$PROJECT_ID/xrplf-release-notifier'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=xrplf-release-notifier@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,APP_SECRET_VERSION=latest,GCS_BUCKET=xrplf-release-notifier'
      - '--memory=256Mi'
      - '--max-instances=1'
      - '--min-instances=0'
