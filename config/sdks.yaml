# XRPL SDK parity targets.
#
# This is the WHOLE config: which repos, which branch. Nothing path-shaped or
# capability-shaped lives here. File locations (definitions.json, the typed-model
# directories, the registry wiring points) and whether the SDK can inject
# server_definitions at runtime are all DISCOVERED by the parity agent from each
# repo itself (see config/parity-skill.md), so a repo refactor never requires a
# config edit. See config/sdk-architecture.md for human reference on how each SDK
# is structured today.

rippled:
  repo: XRPLF/rippled

sdks:
  - { name: xrpl.js,   repo: XRPLF/xrpl.js,   ref: main }
  - { name: xrpl-py,   repo: XRPLF/xrpl-py,   ref: main }
  - { name: xrpl4j,    repo: XRPLF/xrpl4j,    ref: main }
  - { name: xrpl-rust, repo: XRPLF/xrpl-rust, ref: main }
  - { name: xrpl-go,   repo: XRPLF/xrpl-go,   ref: main }

# Where xrpl.org is sourced/published from — the documentation-parity target.
# Page-path conventions (types/<lower>.md, sidebars.yaml nav, known-amendments.md
# entry format) are hard invariants encoded in src/parity/docs.ts.
docs:
  repo: XRPLF/xrpl-dev-portal
  ref: master

# The specification-parity target: the standard each amendment was approved
# under. Amendment -> spec resolution and the legacy/alias exceptions live in
# config/xls-map.yaml; the checks themselves are XLS-1's own rules, encoded in
# src/parity/xlsChecks.ts.
xls:
  repo: XRPLF/XRPL-Standards
  ref: master
