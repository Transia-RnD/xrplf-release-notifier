[package]
name = "vlwatch"
version = "0.1.0"
edition = "2021"
description = "Passive XRPL peer that observes validator-list (UNL) propagation on the network"
license = "ISC"

[dependencies]
monitor-common = { path = "../common" }
openssl = "0.10"
secp256k1 = "0.30"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
