[package]
name = "logmon"
version = "0.1.0"
edition = "2021"
description = "Ingest and parse xrpld trace logs into structured JSONL"

[[bin]]
name = "logmon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
flate2 = "1"
anyhow = "1"
