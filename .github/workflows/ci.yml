name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # lint (zero warnings) + prettier check + tsc build + jest
      - run: npm run check

  deploy:
    # Test-gated deploy: only a green check on a push to main ships. Auth is
    # keyless WIF (scripts/deploy-setup.sh); the provider trusts only this repo.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/417170642979/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@xrplf-release-notifier.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud builds submit --config cloudbuild.yaml --project xrplf-release-notifier .
